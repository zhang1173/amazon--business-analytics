 --primary:#6ea8ff;--primary-soft:#1b2a44;--primary-ink:#0b1220;--good:#4fd18e;--good-soft:#14301f;--warn:#f0b44c;--warn-soft:#3a2b10;--bad:#ff7b72;--bad-soft:#3d1b19;--shade:#4a2a27;--hi:#3a3420;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card+.card,.grid+.card,.card+.grid{margin-top:14px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .hd h2{font-size:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--primary-soft);color:var(--primary)}
.verdict{display:grid;gap:10px;border-left:5px solid var(--primary)}
.verdict.ok{border-left-color:var(--good)}.verdict.no{border-left-color:var(--bad)}
.verdict .big{font-size:22px;font-weight:700;line-height:1.3}
.verdict .sum{font-size:14px;color:var(--muted)}
.verdict .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .v.neg{color:var(--bad)}.kpi .v.pos{color:var(--good)}
.kpi .s{font-size:12px;color:var(--muted)}
.levers{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

input[type=range]{width:100%;accent-color:var(--primary)}

.qa{display:grid;gap:0}
.qa .row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}

.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center}

.f input:focus,.ph input:focus,.oo input:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}

.wrap-in{position:relative}.wrap-in .suffix{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}

.ph .hd input{padding:6px 9px;font-weight:600}

.ph .r2,.ph .r3{display:grid;gap:10px 12px;min-width:0}.ph .r2{grid-template-columns:repeat(2,minmax(0,1fr))}.ph .r3{grid-template-columns:repeat(3,minmax(0,1fr))}
