<style>

}

  --accent:#55bba7; --accent2:#1d3430; --accentInk:#08130f; --input:#352f1b; --inputLine:#6a5a24; --inputFocus:#d9b23b;
  --warn:#ff8a7a; --warnBg:#3a1f1c; --tool:#1f2533; --toolInk:#aab8d8; --shadow:0 1px 2px rgba(0,0,0,.4); --selBg:rgba(85,187,167,.18); --selLine:#55bba7; --inputHead:#4a4123; --menuBg:#242928; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1c201f; --surface2:#242928; --ink:#e9eceb; --ink2:#b3bab7; --ink3:#828a87; --line:#2f3533; --line2:#3c4341;
  --accent:#55bba7; --accent2:#1d3430; --accentInk:#08130f; --input:#352f1b; --inputLine:#6a5a24; --inputFocus:#d9b23b;
  --warn:#ff8a7a; --warnBg:#3a1f1c; --tool:#1f2533; --toolInk:#aab8d8; --shadow:0 1px 2px rgba(0,0,0,.4); --selBg:rgba(85,187,167,.18); --selLine:#55bba7; --inputHead:#4a4123; --menuBg:#242928; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}

.menu{display:flex;flex-direction:column;gap:2px}

.menuwrap{position:relative;display:inline-block}

.card>.bd{padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1 1 auto}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink)}

table.t{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.t th,.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.t thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;z-index:2}
.t thead tr.grp th{background:var(--surface);color:var(--ink3);font-weight:500;border-bottom:0;text-align:center;font-size:11px;letter-spacing:.08em}
.t th.l,.t td.l{text-align:left}
.t .stk{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}

.t td.in input:focus{outline:2px solid var(--inputFocus);outline-offset:-1px}
.t td.short{color:var(--warn);font-weight:650}
.t td.out{background:var(--warnBg);color:var(--warn);font-weight:650}
.t td.mut{color:var(--ink3)}
.t tbody tr:hover td{background:var(--surface2)}
.t tbody tr:hover td.in input{background:var(--input)}
.t td .x{border:0;background:none;color:var(--ink3);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}

.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{color:var(--ink3);font-size:12px}

.f input.y{background:var(--input);border-color:var(--inputLine)}
textarea.paste{width:100%;min-height:110px;border:1px solid var(--line2);border-radius:8px;padding:8px;font:12px/1.5 var(--mono);background:var(--surface)}
.cmp th.pl{min-width:130px}
.cmp th.pl a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink3);cursor:pointer}
.cmp td.k{color:var(--ink2);text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line);white-space:normal;min-width:150px;max-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface);user-select:none}
.chip input{margin:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}

.two{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h3.sec{font-size:13px;margin:4px 0 0;color:var(--ink2);font-weight:650}
.tw.tall{max-height:min(72vh,760px);overflow:auto}
.t tbody tr.grp td{background:var(--surface2);color:var(--ink2);font-size:12px;border-top:1px solid var(--line2)}
.t tbody tr.grp td.stk{background:var(--surface2)}
.t.ann td.in input{min-width:86px}
.t.evt td:nth-child(2),.t.evt td:nth-child(3),.t.evt th:nth-child(2),.t.evt th:nth-child(3){text-align:left}
.cmp td{vertical-align:top;white-space:nowrap}
.cmp tr.sub2 td.k{padding-left:22px}

.chart{margin-top:2px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{stroke:var(--line2);stroke-width:1}
.chart .zl{stroke:var(--ink3);stroke-width:1;stroke-dasharray:4 3}
.chart .ax{fill:var(--ink3);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .mn{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lb{fill:var(--ink);font-size:12px;font-weight:600}
.chart .cx{stroke:var(--ink3);stroke-width:1}
.chart .cd{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.toast .tbtn{border:0;background:transparent;color:var(--bg);text-decoration:underline;cursor:pointer;font:inherit;padding:0 0 0 8px}
@media (max-width:640px){.kpi .v{font-size:17px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi{padding:6px 10px}.kpi .s{font-size:11px}}

.pmenu{position:absolute;right:0;top:100%;z-index:25;background:var(--menuBg);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:150px;padding:4px;margin-top:2px}
.pmenu button,.cmenu button{border:0;background:none;text-align:left;padding:7px 12px;cursor:pointer;border-radius:6px;font-size:13px;white-space:nowrap;display:flex;justify-content:space-between;gap:16px}
.pmenu button:hover,.cmenu button:hover{background:var(--surface2)}
.pmenu button.danger,.cmenu button.danger{color:var(--warn)}
.cmenu{position:fixed;z-index:60;background:var(--menuBg);border:1px solid var(--line2);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);display:flex;flex-direction:column;min-width:170px;padding:4px}

.card.sheet>.hd.tb{padding:8px 10px;gap:8px}
.gw{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%;outline:0}

table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%;outline:0;user-select:none;-webkit-user-select:none}
.g th,.g td{padding:4px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;height:28px}
.g thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;z-index:2;cursor:help}
.g thead th.ih{background:var(--inputHead);color:var(--ink)}
.g th.l,.g td.l{text-align:left}
.g .stk{position:sticky;left:0;background:var(--surface);z-index:1}
.g thead .stk{z-index:3;background:var(--surface2)}

.g .ph{color:var(--ink3);font-style:italic;font-size:12px}
input.ged{position:absolute;z-index:4;border:2px solid var(--selLine);border-radius:0;padding:0 6px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;outline:0;box-shadow:0 2px 8px rgba(0,0,0,.15);font-variant-numeric:tabular-nums;margin:0}
.ibtn{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:4px 7px;font-size:13px;min-width:0}

.ibtn.dt{width:112px}
.ibtn:focus{outline:2px solid var(--inputFocus);outline-offset:-1px}
.seg button.on{background:var(--accent);color:var(--accentInk)}

.dim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:18px;width:min(520px,calc(100vw - 32px));display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow:auto}

.opt>span{flex:1 1 auto;text-align:left}
.opt .sel{margin-left:4px}
.row.sub{padding:4px 0 4px 28px;gap:6px;flex-wrap:nowrap}
.f input.ibtn.n{width:64px}
.f input.ibtn.dt{width:124px}
/* 方案对比：工具的几套 */
.genrows{display:flex;flex-direction:column;gap:8px}
.genrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.genrow.open{border-color:var(--line2);background:var(--surface2)}
.genrow .gname{font-weight:650;font-size:14px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-width:0;width:180px}
.genrow .gname:hover,.genrow .gname:focus{border-color:var(--line2);background:var(--surface)}
.genrow .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* 产品卡选择、路径 */
.prodsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.prodsel .sel{max-width:260px;font-size:13px;color:var(--ink)}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink3);font-size:12px}
.crumb b{color:var(--ink);font-weight:600;font-size:13px}
.crumb i{font-style:normal;color:var(--line2);padding:0 2px}

@media (max-width:760px){
  #app{flex-direction:column}
  aside.nav{position:static;height:auto;width:auto;flex:0 0 auto;flex-direction:row;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
  .logo{padding:0 4px 0 0;flex:0 0 auto}.logo b{font-size:14px}.logo small,.navfoot{display:none}
  .menu{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}.menu::-webkit-scrollbar{display:none}

<script>

 * 纯函数，浏览器里是 window.PlanModel，node 里 require。 */

  function fillState() { return state.ui.fill || (state.ui.fill = { mode: 'same', v: '', a: '', k: '1.2', cap: '', b: '', n: '' }); }
  function fillCount() { const R = selRect(); if (isMulti()) return R.r2 - R.r1 + 1; const F = fillState(); const n = parseInt(F.n, 10); return n > 0 ? Math.min(400, n) : Math.max(1, G.n - R.r1); }
  // 算出要填的一串数（原始值）；col 是哪一列，决定百分比和取整
  function fillValues(col, n) {
    const F = fillState(); const T = col.inp === 'pct' ? 'pct' : 'num';
    const num = s => { const x = parseTyped(T, s); return x == null ? null : x; };
    const round = v => col.k === 'units' ? Math.max(0, Math.round(v)) : v;
    const out = [];
    if (F.mode === 'same') { const v = num(F.v); if (v == null) return null; for (let i = 0; i < n; i++) out.push(round(v)); }
    else if (F.mode === 'mul') {
      const a = num(F.a), k = parseNum(F.k), cap = F.cap === '' || F.cap == null ? null : num(F.cap); if (a == null || k == null) return null;
      let v = a; for (let i = 0; i < n; i++) { if (i > 0) v = v * k; if (cap != null) v = Math.min(cap, v); out.push(round(v)); }
    } else {
      const a = num(F.a), b = num(F.b); if (a == null || b == null) return null;
      for (let i = 0; i < n; i++) out.push(round(n > 1 ? a + (b - a) * i / (n - 1) : a));
    }
    return out;
  }
  function fillPreview() {
    const R = selRect(); const col = G.cols[R.c1]; if (!col || !col.inp || col.inp === 'date') return '先选中能填的格子（黄色的）';
    const n = fillCount(); const vs = fillValues(col, n); if (!vs) return '把上面的数填齐';
    const f = v => col.inp === 'pct' ? pct(v, col.k === 'ctr' ? 2 : 1) : col.k === 'units' ? int(v) : usd(v);
    const shown = vs.slice(0, 8).map(f); return shown.join('、') + (vs.length > 8 ? '、…（共 ' + vs.length + ' 格，最后 ' + f(vs[vs.length - 1]) + '）' : '');
  }
  function viewFill() {
    const F = fillState(); const R = selRect(); const col = G.cols[R.c1]; const multi = isMulti();
    const cols = []; for (let c = R.c1; c <= R.c2; c++) { const k = G.cols[c]; if (k && k.inp && k.inp !== 'date') cols.push(k.l); }
    const where = !cols.length ? '<b class="warn">先在表里选中要填的格子（黄色的那些列）</b>'
      : multi ? '填到 <b>' + esc(cols.join('、')) + '</b> 的 ' + rowLabel(R.r1) + ' 到 ' + rowLabel(Math.min(R.r2, G.n - 1)) + '（' + (R.r2 - R.r1 + 1) + ' 格' + (R.r2 >= G.n ? '，最后一格会新加一天' : '') + '）'
        : '填到 <b>' + esc(col.l) + '</b>，从 ' + rowLabel(R.r1) + ' 往下 <input class="ibtn n" data-f="fill" data-k="n" data-fk="fill.n" value="' + esc(F.n || fillCount()) + '" inputmode="numeric" aria-label="往下几格"> 格';
    const seg = [['same', '全填同一个数'], ['mul', '每天乘倍率'], ['lerp', '匀速变到']].map(m => '<button data-act="fillMode" data-k="' + m[0] + '" class="' + (F.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>').join('');
    const inp = (k, w, ph) => '<input class="ibtn n" style="width:' + w + 'px" data-f="fill" data-k="' + k + '" data-fk="fill.' + k + '" value="' + esc(F[k] == null ? '' : F[k]) + '" inputmode="decimal" placeholder="' + (ph || '') + '" autocomplete="off">';
    const unit = col && col.inp === 'pct' ? '（打 30 就是 30%）' : '';
    let body;
    if (F.mode === 'same') body = '每格都填 ' + inp('v', 90) + ' ' + unit;
    else if (F.mode === 'mul') body = '第一格 ' + inp('a', 80) + '，之后每格 × ' + inp('k', 60, '1.2') + '，封顶 ' + inp('cap', 80, '可空') + ' ' + unit;
    else body = '从 ' + inp('a', 80) + ' 匀速变到 ' + inp('b', 80) + ' ' + unit;
    return '<div class="panel"><div class="row"><b>批量填</b><span class="note">' + where + '</span></div>'
      + '<div class="row"><div class="seg">' + seg + '</div><span class="note">' + body + '</span></div>'
      + '<div class="row"><span class="note" id="fillPrev">会填成：' + esc(fillPreview()) + '</span><span class="sp"></span><button class="btn pri" data-act="fillApply"' + (cols.length ? '' : ' disabled') + '>填进去</button><button class="btn ghost" data-act="panel" data-k="">收起</button></div></div>';
  }
  function fillApply() {
    const R = selRect(); if (!G.editable) return;
    const n = fillCount(); let total = 0;
    snapshot();
    for (let c = R.c1; c <= R.c2; c++) {
      const col = G.cols[c]; if (!col || !col.inp || col.inp === 'date') continue;
      const vs = fillValues(col, n); if (!vs) { undoStack.pop(); toast('把上面的数填齐'); return; }
      for (let i = 0; i < n; i++) {
        const r = R.r1 + i; if (r > G.n) break;
        const txt = col.inp === 'pct' ? iv(vs[i] * 100, 4) : iv(vs[i], 4);
        if (setCell(r, c, txt, true)) total++;
      }
    }
    if (!total) { undoStack.pop(); toast('没填进去，先选中黄色的格子'); return; }
    G.sel.r2 = Math.min(G.n - 1, R.r1 + n - 1); G.sel.c2 = R.c2;
    commit(); toast('填了 ' + total + ' 格', true);
  }

  // ---------- 插天 / 删天 / 改天数 / 挪日期 ----------
  function insertDays(where) {
    const p = realPlan(); if (!p || !G.editable) return;
    const R = selRect(); const r1 = R.r1, r2 = Math.min(R.r2, G.n - 1);
    const n = G.n ? r2 - r1 + 1 : 1;
    snapshot();
    if (!G.n) { for (let i = 0; i < n; i++) appendRow(null); commit(); toast('加了一天', true); return; }
    const rows = G.order.map(i => p.rows[i]); // 按日期顺序
    const at = where === 'above' ? r1 : r2 + 1;           // 新的 n 天插在这个位置之前
    const base = where === 'above' ? rows[r1] : rows[r2];
    const d0 = M.parseDate(where === 'above' ? rows[r1].date : rows[r2].date) + (where === 'above' ? 0 : 1);
    for (let k = at; k < rows.length; k++) rows[k].date = M.fmtDate(M.parseDate(rows[k].date) + n);   // 后面的整体往后挪
    const add = []; for (let i = 0; i < n; i++) add.push(Object.assign({}, base, { date: M.fmtDate(d0 + i) }));
    p.rows = rows.slice(0, at).concat(add, rows.slice(at));
    G.sel = { r: at, c: G.sel.c, r2: at + n - 1, c2: G.sel.c };
    commit(); toast('插了 ' + n + ' 天，后面的日期往后挪了 ' + n + ' 天', true);
  }
  function delDays() {
    const p = realPlan(); if (!p || !G.editable || !G.n) return;
    const R = selRect(); const r1 = R.r1, r2 = Math.min(R.r2, G.n - 1); if (r2 < r1) return;
    snapshot();
    const kill = new Set(); for (let r = r1; r <= r2; r++) kill.add(G.order[r]);
    p.rows = p.rows.filter((x, i) => !kill.has(i));
    G.sel = { r: r1, c: G.sel.c, r2: r1, c2: G.sel.c };
    commit(); toast('删掉了 ' + kill.size + ' 天', true);
  }
  function setDays(n) {
    const p = realPlan(); if (!p || !G.editable) return;
    n = Math.round(n); if (!(n >= 0) || n > 400) { toast('天数要在 0 到 400 之间'); scheduleRender(); return; }
    const cur = p.rows.length; if (n === cur) return;
    snapshot();
    if (n > cur) { if (!cur) { const sd = (app.querySelector('[data-f="startDate"]') || {}).value; const d = parseDateLoose(sd, yearHint); p.rows.push(blankRow(d || '2026-11-07')); G.order = [0]; G.n = 1; } while (p.rows.length < n) appendRow(null); commit(); toast('加到 ' + n + ' 天，新加的照最后一天抄的', true); }
    else { const rows = G.order.map(i => p.rows[i]); p.rows = rows.slice(0, n); commit(); toast('从后面删掉了 ' + (cur - n) + ' 天', true); }
  }
  function shiftDates(newStart) {
    const p = realPlan(); if (!p || !G.editable || !p.rows.length) return;
    const first = firstRow(p); const delta = M.parseDate(newStart) - M.parseDate(first.date); if (!delta) return;
    snapshot(); p.rows.forEach(r => { r.date = M.fmtDate(M.parseDate(r.date) + delta); });
    commit(); toast('整张表的日期都挪了 ' + (delta > 0 ? '往后 ' + delta : '往前 ' + -delta) + ' 天', true);
  }

  function niceStep(span) { const raw = span / 4 || 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function cashChart(L) {
    const daily = L.daily; if (!daily.length) { chartData = null; return ''; }
    const W = chartWidth(), H = 250, ml = 62, mr = 14, mt = 18, mb = 26;
    const d0 = daily[0].d, d1 = daily[daily.length - 1].d;
    let lo = Math.min(0, ...daily.map(p => p.bal)), hi = Math.max(0, ...daily.map(p => p.bal));
    const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
    const x = d => ml + (d - d0) / Math.max(1, d1 - d0) * (W - ml - mr);
    const y = v => mt + (hi - v) / (hi - lo) * (H - mt - mb);
    let g = '';
    for (let v = lo; v <= hi + 1e-6; v += step) g += '<line class="gl" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="ax" x="' + (ml - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(wan(v)) + '</text>';
    let mk = M.monthKey(d0); const lastMk = M.monthKey(d1); let guard = 0;

      if (d >= d0) g += '<line class="tk" x1="' + x(d).toFixed(1) + '" x2="' + x(d).toFixed(1) + '" y1="' + (H - mb) + '" y2="' + (H - mb + 4) + '"/><text class="ax" x="' + (x(d) + 3).toFixed(1) + '" y="' + (H - 8) + '">' + (mm === 1 && W >= 640 ? yy + '年' : '') + mm + '月</text>';
      mk = M.nextMonthKey(mk);
    }
    if (lo < 0) g += '<line class="zl" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>';
    let path = 'M' + x(daily[0].d).toFixed(1) + ',' + y(daily[0].bal).toFixed(1);
    for (let i = 1; i < daily.length; i++) path += 'H' + x(daily[i].d).toFixed(1) + 'V' + y(daily[i].bal).toFixed(1);
    const mx = x(L.minDate), my = y(L.minBal);

  function wireChart() {

    const C = chartData;
    const move = ev => {
      const rc = svg.getBoundingClientRect(); const sx = (ev.clientX - rc.left) / rc.width * C.W;
      const d = Math.round(C.d0 + (sx - C.ml) / (C.W - C.ml - C.mr) * Math.max(1, C.d1 - C.d0));
      const i = Math.max(0, Math.min(C.daily.length - 1, d - C.d0)); const p = C.daily[i];
      const px = C.x(p.d), py = C.y(p.bal);
      cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.style.display = '';
      cd.setAttribute('cx', px); cd.setAttribute('cy', py); cd.style.display = '';
      tip.hidden = false; tip.textContent = M.fmtDate(p.d) + ' · ' + cny(p.bal);
      tip.style.left = (px / C.W * rc.width) + 'px'; tip.style.top = (py / C.H * rc.height) + 'px';
    };
    const leave = () => { tip.hidden = true; cx.style.display = 'none'; cd.style.display = 'none'; };

  // 一件货的账（照用户 Excel《利润数据表》：体积重、计费重、空运 / 快船头程、佣金、退货、FBA、仓储 → 每件利润）
  function unitSheet(prod, price, coupon) {
    const P = Object.assign({}, state.params, feesOf(prod)); const fx = +P.fx || 6.8;
    const volKg = (+prod.L || 0) * (+prod.W || 0) * (+prod.H || 0) / 6000;
    const billKg = Math.max(+prod.kg || 0, volKg);
    const airCny = (+prod.airRate || 0) * billKg, shipCny = (+prod.shipRate || 0) * volKg, seaCny = (+prod.seaRate || 0) * volKg;
    const costUsd = (+prod.goodsCny || 0) / fx;
    const ue = M.unitEconomics({ price, prime: 0, coupon, couponUse: 0.8, primeUse: 0.9 }, P);
    const payback = ue.avgPrice - ue.couponFeeUnit - ue.feesUnit;
    const prof = fr => payback - costUsd - fr / fx;
    return { fx, volKg, billKg, airCny, shipCny, seaCny, costUsd, ue, payback, airProfit: prof(airCny), shipProfit: prof(shipCny), seaProfit: prof(seaCny),
      roi: fr => (+prod.goodsCny || 0) > 0 ? prof(fr) * fx / +prod.goodsCny : null };
  }

  // ---------- 输入（表格以外的框） ----------
  function fillPrevUpdate() { const el = document.getElementById('fillPrev'); if (el) el.textContent = '会填成：' + fillPreview(); }
  function switchProduct(pid) {
    const prod = productOf(pid); if (!prod) return;
    state.ui.productId = prod.id; state.ui.menu = null; state.ui.panel = null; state.ui.genOpen = null;
    const ps = plansOf(prod.id); const ad = adoptedPlan(prod);
    state.ui.planId = ps.some(x => x.id === state.ui.planId) ? state.ui.planId : (ad ? ad.id : (ps[0] ? ps[0].id : ''));
    G.sel = { r: 0, c: 0, r2: 0, c2: 0 };

  }
  function applyChange(el) {
    const dv = M.parseDate(el.defaultValue); yearHint = dv != null ? M.parts(dv).y : 2026;
    const f = el.dataset.f; const v = el.value; const k = el.dataset.k; const i = el.dataset.i === '' || el.dataset.i == null ? null : +el.dataset.i;
    const p = curPlan(); const prod = curProduct();
    switch (f) {
      case 'productSel': switchProduct(v); return;
      case 'planSel': { state.ui.planId = v; state.ui.menu = null; state.ui.panel = null; G.sel = { r: 0, c: 0, r2: 0, c2: 0 }; save(); scheduleRender(); return; }
      case 'plansFilter': state.ui.plansFilter = v; scheduleRender(); return;
      case 'coFilter': state.ui.coFilter = v; save(); scheduleRender(); return;
      case 'activePlan': { const pr = productOf(k); if (!pr) return; snapshot(); pr.activePlanId = v; break; }
      case 'prodName': { if (!prod) return; const nm = v.trim(); if (!nm || nm === prod.name) { scheduleRender(); return; } snapshot(); prod.name = nm; break; }
      case 'prod': {
        if (!prod) return; const t = el.dataset.t;
        if (k === 'parentId') { if (v === prod.id || (v && childrenOf(prod.id).length)) { toast('父体下面已经有子体了，不能再当子体'); scheduleRender(); return; } snapshot(); prod.parentId = v; break; }
        const x = t === 'text' ? v.trim() : parseTyped(t, v);
        if (x == null) { scheduleRender(); return; }
        snapshot();
        prod[k] = k === 'refundCommBack' ? x === 'true' || x === true : x;
        if (FEE_KEYS.has(k)) prod.preset = 'custom';
        break;
      }
      case 'planName': { const nm = v.trim(); const o = p ? (p.kind === 'ops' ? p.src : p.gen) : null; if (o && nm && nm !== o.name) { snapshot(); o.name = nm; } state.ui.renaming = null; break; }
      case 'days': { const n = parseNum(v); if (n == null) { scheduleRender(); return; } setDays(n); return; }
      case 'startDate': { const d = parseDateLoose(v, yearHint); if (!d) { toast('日期没认出来，写成 11-07 或 2026-11-07'); scheduleRender(); return; } shiftDates(d); return; }
      case 'dlg': { if (!state.ui.dlg) return; if (el.type === 'radio' && !el.checked) return; state.ui.dlg[k] = v; if (k === 'from') { pendingFocus = v === 'blank' ? 'dlg.start' : v === 'copy' ? 'dlg.src' : null; scheduleRender(); } return; }
      case 'fill': { fillState()[k] = v; fillPrevUpdate(); return; }
      case 'gen': { const t = el.dataset.t; const x = parseTyped(t, v); if (x == null) { scheduleRender(); return; } snapshot(); const g = state.gens[i]; g[k] = x; if (Array.isArray(g.rows)) { delete g.rows; commit(); toast('「' + g.name + '」按新参数重新出了，表里手改的被盖掉了', true); return; } break; }
      case 'genName': { const nm = v.trim(); if (!nm) { scheduleRender(); return; } snapshot(); state.gens[i].name = nm; break; }
      case 'param': {
        const t = el.dataset.t; const x = parseTyped(t === 'date' && v === '' ? 'text' : t, v);
        if (x == null) { scheduleRender(); return; }

      }
      case 'batchMove': {
        if (!prod || !v) { scheduleRender(); return; }
        snapshot(); if (!moveBatch(prod, i, v)) { scheduleRender(); return; }
        toast('挪到「' + productOf(v).name + '」的卡上了', true); break;
      }
      case 'batch': {
        if (!prod) return; const t = el.dataset.t; const x = t === 'text' ? v : parseTyped(t, v);
        if (x == null) { scheduleRender(); return; }
        snapshot(); const b = prod.batches[i]; if (!b) return; b[k] = x;

  }
  app.addEventListener('change', e => {

      const why = !it ? (ps.length ? '<span class="mut">父体已按自己的方案算，这里不重复</span>' : '<span class="mut">还没有计划表</span>') : '';
      rows += '<tr' + (it ? '' : ' class="sub"') + '><td class="stk l">' + (depth ? '　└ ' : '') + esc(prod.name) + (prod.asin ? ' <span class="mut">' + esc(prod.asin) + '</span>' : '') + '</td><td class="l">' + sel + ' ' + why + '</td>'
        + (c ? '<td>' + c.days + ' 天</td><td>' + int(c.units) + '</td><td>' + usd(c.sales, 0) + '</td><td>' + usd(c.ad, 0) + '</td><td>' + usd(c.net, 0) + '</td><td>' + usd(c.profit, 0) + '</td><td>' + cny(c.batchCostCny) + '</td><td>' + (c.soldOut != null ? M.fmtDate(c.soldOut) : '剩 ' + int(c.stockEnd)) + '</td>' : '<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>') + '</tr>';
    });
    h += '<div class="tw" data-sk="co"><table class="t"><thead><tr><th class="stk l">产品卡</th><th class="l">总账里采用的方案</th><th>推广天数</th><th>单量</th><th>销售额 $</th><th>广告 $</th><th>回款（已扣广告）$</th><th>利润 $</th><th>发货货值 + 头程 ¥</th><th>卖完 / 剩</th></tr></thead><tbody>' + rows + '</tbody>'
      + '<tfoot><tr><td class="stk l">合计</td><td></td><td></td><td>' + int(T.units) + '</td><td>' + usd(T.sales, 0) + '</td><td>' + usd(T.ad, 0) + '</td><td>' + usd(T.net, 0) + '<br><span class="mut">' + cny(T.net * fx) + '</span></td><td>' + usd(T.profit, 0) + '<br><span class="mut">' + cny(T.profit * fx) + '</span></td><td>' + cny(T.ship) + '</td><td></td></tr></tfoot></table></div>';
    h += '<div class="bd"><p class="note">看父体时把子体加进去：父体自己有采用的方案就按父体算（父体的货就是所有子体的批次加起来），子体不再重复；父体没有方案时子体各算各的。</p></div></div>';
    if (!items.length) return h + '<div class="card"><div class="bd note">还没有可以叠的方案。</div></div>';
    // 现金
    const fixedShort = L.checks.filter(c => c.kind === 'fixed' && c.after < 0).map(c => ({ d: c.d, short: -c.after }));
    const dues = L.checks.filter(c => c.kind === 'goods' || c.kind === 'freight');
    const dueShort = dues.filter(c => c.after < 0).map(c => ({ d: c.d, short: -c.after, note: c.note }));
    const k = (l, v, s) => '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
    const endBal = L.daily.length ? L.daily[L.daily.length - 1].bal : +P.cashStart;
    const inflow = L.events.filter(e => e.kind === 'sales').reduce((a, e) => a + e.amt, 0), adOut = L.events.filter(e => e.kind === 'ad').reduce((a, e) => a + e.amt, 0);
    h += '<div class="card"><div class="hd"><h2>公司账上现金</h2><span class="sub">人民币 · 按天 · 从 ' + esc(P.cashStartDate) + ' 账上 ' + cny(P.cashStart) + ' 起 · ' + items.length + ' 个产品叠在一起</span></div><div class="bd" style="display:flex;flex-direction:column;gap:12px"><div class="kpis">'
      + k('账上最低现金', cny(L.minBal), M.fmtDate(L.minDate))
      + k('算到 ' + M.fmtDate(L.end), cny(endBal), '期末现金')
      + k('回款到账合计', cny(inflow), '广告扣款 ' + cny(adOut))
      + k('15 号发薪够不够', fixedShort.length ? fixedShort.length + ' 次不够' : '都够', fixedShort.length ? fixedShort.map(x => M.shortDate(x.d) + ' 差 ' + cny(x.short)).join('；') : L.checks.filter(c => c.kind === 'fixed').length + ' 次都够')
      + k('到期货款 / 头程那天', dueShort.length ? dueShort.length + ' 笔不够' : '都够', dueShort.length ? dueShort.map(x => M.shortDate(x.d) + ' 差 ' + cny(x.short)).join('；') : (dues.length ? dues.length + ' 笔都够' : '没有到期的'))
      + '</div>' + cashChart(L) + '</div></div>';
    const MCOLS = [{ l: '月份', k: 'month', t: 'month' }, { l: '月初现金', k: 'open', t: 'cny' }, { l: '+ 回款到账', k: 'sales', t: 'cny' }, { l: MINUS + ' 广告', k: 'ad', t: 'cny' }, { l: MINUS + ' 固定开支', k: 'fixed', t: 'cny' }, { l: MINUS + ' 到期货款 / 头程', k: 'goods', t: 'cny' }, { l: '= 月末现金', k: 'close', t: 'cny' }, { l: '月内最低', k: 'min', t: 'cny' }, { l: '哪天', k: 'minDate', t: 'date' }];
    h += '<div class="card"><div class="hd"><h2>每月现金（所有产品）</h2><span class="sub">人民币</span></div>' + simpleTable(MCOLS, L.months, null, 'com') + '</div>';
    let bal = +P.cashStart || 0;
    const ev = L.events.map(e => { bal += e.amt; return { d: e.d, kind: KIND[e.kind] || e.kind, note: e.note, amt: e.amt, after: bal }; });
    const ECOLS = [{ l: '日期', k: 'd', t: 'date' }, { l: '事项', k: 'kind', t: 'text' }, { l: '哪个产品 · 说明', k: 'note', t: 'text' }, { l: '金额', k: 'amt', t: 'cny' }, { l: '之后余额', k: 'after', t: 'cny' }];
    h += '<div class="card"><div class="hd"><h2>每一笔进出</h2><span class="sub">' + ev.length + ' 笔</span></div>' + (ev.length ? simpleTable(ECOLS, ev, null, 'coe', 'evt') : '<div class="bd note">没有进出。</div>') + '</div>';
    return h;
  }

  // 测试用
  window.__promo = { state: () => state, calc: id => calc(allPlans().find(p => p.id === id) || curPlan()), render, grid: G, setCell, pasteText, undo, redo, go: goTab };
  render();
})();

</script>
</body></html>
