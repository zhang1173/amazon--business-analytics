<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>推广计划表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface2:#efede6; --ink:#1c1f1e; --ink2:#4f5554; --ink3:#868c8a; --line:#e0ddd3; --line2:#cfcbbf;
  --accent:#0d6b5c; --accent2:#e3f0ec; --accentInk:#ffffff; --input:#fff6d1; --inputLine:#e4cf7d; --inputFocus:#c79a14;
  --warn:#b42318; --warnBg:#fdecea; --tool:#eef1f8; --toolInk:#3b4a6b; --shadow:0 1px 2px rgba(30,30,20,.06),0 2px 8px rgba(30,30,20,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1c201f; --surface2:#242928; --ink:#e9eceb; --ink2:#b3bab7; --ink3:#828a87; --line:#2f3533; --line2:#3c4341;
  --accent:#55bba7; --accent2:#1d3430; --accentInk:#08130f; --input:#352f1b; --inputLine:#6a5a24; --inputFocus:#d9b23b;
  --warn:#ff8a7a; --warnBg:#3a1f1c; --tool:#1f2533; --toolInk:#aab8d8; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1c201f; --surface2:#242928; --ink:#e9eceb; --ink2:#b3bab7; --ink3:#828a87; --line:#2f3533; --line2:#3c4341;
  --accent:#55bba7; --accent2:#1d3430; --accentInk:#08130f; --input:#352f1b; --inputLine:#6a5a24; --inputFocus:#d9b23b;
  --warn:#ff8a7a; --warnBg:#3a1f1c; --tool:#1f2533; --toolInk:#aab8d8; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.brand h1{font-size:18px;margin:0;letter-spacing:.02em;white-space:nowrap}
.brand small{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px 9px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding-block:14px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:15px;margin:0;font-weight:650}
.card>.hd .sub{color:var(--ink3);font-size:12px}
.card>.bd{padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1 1 auto}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
select.sel{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 8px;max-width:100%}
.planbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.planbar label{color:var(--ink3);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent2);color:var(--accent);white-space:nowrap}
.tag.tool{background:var(--tool);color:var(--toolInk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:10px 12px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi .l{color:var(--ink3);font-size:12px}
.kpi .v{font-size:19px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.kpi .s{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.t th,.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.t thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;z-index:2}
.t thead tr.grp th{background:var(--surface);color:var(--ink3);font-weight:500;border-bottom:0;text-align:center;font-size:11px;letter-spacing:.08em}
.t th.l,.t td.l{text-align:left}
.t .stk{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.t thead .stk{z-index:3;background:var(--surface2)}
.t tfoot td{font-weight:650;background:var(--surface2);border-top:1px solid var(--line2)}
.t tfoot .stk{background:var(--surface2)}
.t tr.sum td{font-weight:650;background:var(--surface2)}
.t tr.sub td{color:var(--ink3)}
.t td.in{padding:2px 3px}
.t td.in input{width:100%;min-width:62px;border:1px solid var(--inputLine);background:var(--input);border-radius:5px;padding:3px 5px;text-align:right;font-variant-numeric:tabular-nums}
.t td.in input.dt{min-width:100px;text-align:left}
input.sel.dt{width:150px}
.t td.in input:focus{outline:2px solid var(--inputFocus);outline-offset:-1px}
.t td.short{color:var(--warn);font-weight:650}
.t td.out{background:var(--warnBg);color:var(--warn);font-weight:650}
.t td.mut{color:var(--ink3)}
.t tbody tr:hover td{background:var(--surface2)}
.t tbody tr:hover td.in input{background:var(--input)}
.t td .x{border:0;background:none;color:var(--ink3);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.t td .x:hover{color:var(--warn)}
.note{color:var(--ink3);font-size:12px;line-height:1.6;max-width:78ch}
.note b{color:var(--ink2);font-weight:600}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:10px;background:var(--tool);color:var(--toolInk);font-size:13px}
.panel{border:1px dashed var(--line2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{color:var(--ink3);font-size:12px}
.f input,.f select{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:5px 7px;width:100%;min-width:0}
.f input.y{background:var(--input);border-color:var(--inputLine)}
textarea.paste{width:100%;min-height:110px;border:1px solid var(--line2);border-radius:8px;padding:8px;font:12px/1.5 var(--mono);background:var(--surface)}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gen{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.gen .hd{display:flex;align-items:center;gap:8px}
.gen .hd input{font-weight:650;font-size:15px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;min-width:0;flex:1}
.gen .hd input:hover,.gen .hd input:focus{border-color:var(--line2)}
.gen .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.cmp th.pl{min-width:130px}
.cmp th.pl a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink3);cursor:pointer}
.cmp td.k{color:var(--ink2);text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line);white-space:normal;min-width:150px;max-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface);user-select:none}
.chip input{margin:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h3.sec{font-size:13px;margin:4px 0 0;color:var(--ink2);font-weight:650}
.tw.tall{max-height:min(72vh,760px);overflow:auto}
.t tbody tr.grp td{background:var(--surface2);color:var(--ink2);font-size:12px;border-top:1px solid var(--line2)}
.t tbody tr.grp td.stk{background:var(--surface2)}
.t.ann td.in input{min-width:86px}
.t.evt td:nth-child(2),.t.evt td:nth-child(3),.t.evt th:nth-child(2),.t.evt th:nth-child(3){text-align:left}
.cmp td{vertical-align:top;white-space:nowrap}
.cmp tr.sub2 td.k{padding-left:22px}
.cmp .mut{color:var(--ink3);font-size:12px}
.chart{margin-top:2px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{stroke:var(--line2);stroke-width:1}
.chart .zl{stroke:var(--ink3);stroke-width:1;stroke-dasharray:4 3}
.chart .ax{fill:var(--ink3);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .mn{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lb{fill:var(--ink);font-size:12px;font-weight:600}
.chart .cx{stroke:var(--ink3);stroke-width:1}
.chart .cd{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.toast .tbtn{border:0;background:transparent;color:var(--bg);text-decoration:underline;cursor:pointer;font:inherit;padding:0 0 0 8px}
@media (max-width:640px){.brand small{display:none}.kpi .v{font-size:17px}.gen .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* 推广计划表 · 计算核心（第二代）
 * 公式照用户 Excel《Y三件套内衣计划细节表-运营填写》《推广计划汇总表》《目标汇总表》；
 * 资金盘按亚马逊 DD+7 延迟交易 + 每 14 天结算（见方案稿第八节）。
 * 纯函数，浏览器里是 window.PlanModel，node 里 require。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PlanModel = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- 日期：一律用"天号"（1970-01-01 起的天数，UTC） ----------
  const DAY = 86400000;
  function dn(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY); }
  function parts(n) { const t = new Date(n * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), wd: t.getUTCDay() }; }
  function pad2(x) { return String(x).padStart(2, '0'); }
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number' && isFinite(v)) return (v > 20000 && v < 80000) ? Math.round(v) - 25569 : null; // Excel 序列号
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?/);
    if (m) return dn(+m[1], +m[2], +m[3]);
    if (/^\d{5}(\.\d+)?$/.test(s)) return Math.round(parseFloat(s)) - 25569;
    return null;
  }
  function fmtDate(n) { const p = parts(n); return p.y + '-' + pad2(p.m) + '-' + pad2(p.d); }
  function shortDate(n) { const p = parts(n); return p.m + '/' + p.d; }
  function monthKey(n) { const p = parts(n); return p.y + '-' + pad2(p.m); }
  function monthLabel(key) { const a = key.split('-'); return a[0] + '年' + (+a[1]) + '月'; }
  function nextMonthKey(key, k) { k = k == null ? 1 : k; let [y, m] = key.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad2(m); }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function addMonths(n, k) { const p = parts(n); let y = p.y, m = p.m + k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return dn(y, m, Math.min(p.d, daysInMonth(y, m))); }
  function weekday1(n) { return parts(n).wd + 1; }                       // Excel WEEKDAY(,1)：周日=1
  function weekday2(n) { const w = parts(n).wd; return w === 0 ? 7 : w; } // Excel WEEKDAY(,2)：周一=1
  function weeknum1(n) { const p = parts(n); const jan1 = dn(p.y, 1, 1); return Math.floor((n - jan1 + parts(jan1).wd) / 7) + 1; } // Excel WEEKNUM(,1)
  function weekKey(n) { const ws = n - weekday1(n) + 1; return parts(ws).y + '-W' + pad2(weeknum1(ws)); } // 同用户汇总表 A 列
  function monthsBetween(a, b) { const out = []; let k = a; let guard = 0; while (k <= b && guard++ < 600) { out.push(k); k = nextMonthKey(k); } return out; }
  function xround(x, dp) { const f = Math.pow(10, dp); return Math.sign(x) * Math.round(Math.abs(x) * f + 1e-9) / f; } // Excel ROUND
  function num(v, dflt) { const x = typeof v === 'number' ? v : parseFloat(v); return isFinite(x) ? x : dflt; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- 参数 ----------
  const PRESETS = {
    finance: { fba: 6.50, returnRate: 0.10, returnFee: 3, storage: 0.11, inbound: 0, carrier: 0, couponFeeRate: 0.025, costMode: 'batch' },
    sheet:   { fba: 6.04, returnRate: 0.08, returnFee: 0, storage: 0.09, inbound: 0, carrier: 0, couponFeeRate: 0.025, costMode: 'fixed' },
  };
  const PRESET_LABEL = { finance: '财务包口径', sheet: '原表格口径' };
  function defaultParams() {
    return Object.assign({
      preset: 'finance',
      commMin: 0.30,
      commTiers: [{ upTo: 15, rate: 0.05 }, { upTo: 20, rate: 0.10 }, { upTo: null, rate: 0.17 }],
      fixedGoods: 8.507462686567164,   // 原表格：57 元 / 6.7
      fixedFreight: 1.1237960199005,   // 原表格：混发头程加权
      fx: 6.8,
      cashStart: 600000, cashStartDate: '2026-11-01',
      fixedMonthly: 70000, fixedDay: 15,
      payDays: 25,                       // 日表"回款日期" = 下单 + 25 天（同 Excel）
      deliveryDays: 2, reserveDays: 7,   // 资金盘：送达 + 7 天释放（DD+7）
      settleMode: 'monthly', settleDays: [14, 28], settleAnchor: '2026-11-02',
      bankDays: 5, payoutMode: 'auto',   // auto = 每 14 天自动结算；dod = 按需提现
      horizonEnd: '',
    }, PRESETS.finance);
  }
  function applyPreset(P, key) { return Object.assign({}, P, PRESETS[key], { preset: key }); }

  function defaultBatches() {
    return [{ id: 'b1', name: 'SHIP-7d45bc55 首批', qty: 2600, shipDate: '2026-09-30', arriveDate: '2026-10-30', mode: '海运',
      goodsCny: 55.5, freightCny: 5, goodsTermMonths: 6, freightTermDays: 60 }];
  }
  function batchInfo(b, P) {
    const ship = parseDate(b.shipDate);
    const arrive = parseDate(b.arriveDate);
    const qty = Math.max(0, num(b.qty, 0));
    const goodsCny = num(b.goodsCny, 0), freightCny = num(b.freightCny, 0);
    const fixed = P.costMode === 'fixed';
    return Object.assign({}, b, {
      qty, ship, arrive: arrive == null ? ship : arrive,
      goodsUsd: fixed ? P.fixedGoods : goodsCny / P.fx,
      freightUsd: fixed ? P.fixedFreight : freightCny / P.fx,
      goodsDue: ship == null ? null : addMonths(ship, num(b.goodsTermMonths, 0)),
      freightDue: ship == null ? null : ship + num(b.freightTermDays, 0),
      goodsTotalCny: qty * goodsCny, freightTotalCny: qty * freightCny,
      isAir: /空/.test(b.mode || ''),
    });
  }

  // ---------- 每日表（照 Excel 公式） ----------
  function commOn(p, P) {
    let rate = P.commTiers[P.commTiers.length - 1].rate;
    for (const t of P.commTiers) { if (t.upTo == null || p <= t.upTo) { rate = t.rate; break; } }
    return Math.max(P.commMin, xround(p * rate, 2));
  }
  function unitEconomics(r, P) {
    const E = num(r.price, 0), F = num(r.prime, 0), G = num(r.coupon, 0);
    const H = num(r.couponUse, 0.8), I = num(r.primeUse, 0.9);
    const minPrice = E * (1 - G) * (1 - F);                       // J
    const avgPrice = E * (1 - G * H) * (1 - F * I);               // K
    const commission = E > 0 ? (commOn(E * (1 - G) * (1 - F), P) * H * I + commOn(E * (1 - G), P) * H * (1 - I)
      + commOn(E * (1 - F), P) * (1 - H) * I + commOn(E, P) * (1 - H) * (1 - I)) : 0;  // Z
    const returns = avgPrice * P.returnRate + P.returnRate * P.returnFee; // AG（原表格 = K × 8%）
    const couponFeeUnit = G === 0 ? 0 : E * (1 - G) * (1 - F * I) * H * P.couponFeeRate; // AH ÷ T
    const feesUnit = commission + P.fba + returns + P.inbound + P.carrier + P.storage;
    return { E, F, G, H, I, minPrice, avgPrice, commission, returns, couponFeeUnit, feesUnit };
  }

  function computeRows(rows, P, batches) {
    const B = batches.map(b => batchInfo(b, P)).filter(b => b.ship != null && b.qty > 0).sort((a, b) => a.arrive - b.arrive);
    const lots = B.map(b => ({ b, left: b.qty }));
    const list = rows.map((r, idx) => ({ r, idx, d: parseDate(r.date) })).filter(x => x.d != null).sort((a, b) => a.d - b.d || a.idx - b.idx);
    const out = [];
    for (const { r, idx, d } of list) {
      const ue = unitEconomics(r, P);
      const unitsPlan = Math.max(0, num(r.units, 0));
      let avail = 0; for (const L of lots) if (L.b.arrive <= d) avail += L.left;
      const T = Math.min(unitsPlan, avail);
      let need = T, gSum = 0, fSum = 0;
      for (const L of lots) {
        if (need <= 1e-12) break;
        if (L.b.arrive > d || L.left <= 0) continue;
        const take = Math.min(need, L.left); L.left -= take; need -= take;
        gSum += take * L.b.goodsUsd; fSum += take * L.b.freightUsd;
      }
      let goodsU, freightU;
      if (P.costMode === 'fixed') { goodsU = P.fixedGoods; freightU = P.fixedFreight; }
      else if (T > 0) { goodsU = gSum / T; freightU = fSum / T; }
      else { const nx = lots.find(L => L.left > 0) || lots[lots.length - 1]; goodsU = nx ? nx.b.goodsUsd : 0; freightU = nx ? nx.b.freightUsd : 0; }
      let stockLeft = 0; for (const L of lots) if (L.b.arrive <= d) stockLeft += L.left;
      const cvr = num(r.cvr, 0), cpc = num(r.cpc, 0);
      const cpa = cvr > 0 ? cpc / cvr : 0;                         // Q
      const adShare = Math.min(1, Math.max(0, num(r.adShare, 1)));  // V

  // ---------- 汇总 ----------
  function sumBy(rows, keyFn, fields) {
    const m = new Map();

      const k = keyFn(r);
      if (!m.has(k)) { const o = { key: k, n: 0 }; fields.forEach(f => o[f] = 0); m.set(k, o); }
      const o = m.get(k); o.n++; fields.forEach(f => o[f] += r[f] || 0);

  }

  function settlementDates(P, from, to) {
    const out = [];

      const a = parseDate(P.settleAnchor) || from;
      let s = a + Math.ceil((from - a) / 14) * 14;
      for (; s <= to; s += 14) out.push(s);
    } else {
      const days = (P.settleDays && P.settleDays.length ? P.settleDays : [14, 28]).map(Number).filter(x => x >= 1 && x <= 31).sort((a, b) => a - b);
      for (const mk of monthsBetween(monthKey(from), monthKey(to))) {
        const [y, m] = mk.split('-').map(Number);
        for (const dd of days) { const s = dn(y, m, Math.min(dd, daysInMonth(y, m))); if (s >= from && s <= to && out[out.length - 1] !== s) out.push(s); }
      }
    }

  }

  // 资金盘（人民币，按天）
  function ledger(rows, P, batches) {
    const fx = num(P.fx, 6.8);
    const start = parseDate(P.cashStartDate) || (rows.length ? rows[0].d : dn(2026, 11, 1));
    const ev = []; // {d, kind, amt, note}
    if (P.payoutMode === 'dod') {
      for (const r of rows) {
        if (r.payback) ev.push({ d: r.release + num(P.bankDays, 5), kind: 'sales', amt: r.payback * fx, note: '按需提现到账' });
        if (r.adSpend) ev.push({ d: r.d, kind: 'ad', amt: -r.adSpend * fx, note: '广告' });
      }
    } else if (rows.length) {
      const first = Math.min(rows[0].d, start);
      const last = Math.max(...rows.map(r => Math.max(r.release, r.d)));
      const S = settlementDates(P, first - 31, last + 40);
      let prev = -Infinity;
      for (const s of S) {
        let gross = 0, ads = 0;
        for (const r of rows) { if (r.release > prev && r.release <= s) gross += r.payback; if (r.d > prev && r.d <= s) ads += r.adSpend; }
        if (gross || ads) {

          if (ads) ev.push({ d: pd, kind: 'ad', amt: -ads * fx, settle: s, note: fmtDate(s) + (gross - ads >= 0 ? ' 结算扣广告' : ' 结算不够扣，信用卡付广告') });
        }
        prev = s;
      }
    }
    for (const b0 of batches) {
      const b = batchInfo(b0, P);
      if (b.ship == null || !b.qty) continue;
      if (b.goodsTotalCny) ev.push({ d: b.goodsDue, kind: 'goods', amt: -b.goodsTotalCny, note: (b.name || '批次') + ' 货款' });
      if (b.freightTotalCny) ev.push({ d: b.freightDue, kind: 'freight', amt: -b.freightTotalCny, note: (b.name || '批次') + ' 头程' });

      const d = dn(y, m, Math.min(num(P.fixedDay, 15), daysInMonth(y, m)));
      if (d >= start && d <= end && P.fixedMonthly) ev.push({ d, kind: 'fixed', amt: -num(P.fixedMonthly, 0), note: '固定开支' });

      const M = months.get(mk);

        else if (e.kind === 'fixed') M.fixed += e.amt; else M.goods += e.amt;

    const arrivals = new Map();
    for (const e of inWin) if (e.kind === 'sales' || e.kind === 'ad') arrivals.set(monthKey(e.d), (arrivals.get(monthKey(e.d)) || 0) + e.amt);
    return { start, end, events: inWin, daily, months: [...months.values()], minBal, minDate, checks, arrivals };
  }

  function computePlan(planRows, P, batches) {

    const BI = batches.map(b => batchInfo(b, P)).filter(b => b.ship != null && b.qty > 0);
    const F = ['units', 'adSpend', 'net', 'profit', 'sales', 'goodsTotal', 'freightTotal', 'payback', 'adUnits', 'natural', 'couponFee', 'short'];

      units: tot.units, goods: tot.goods, freight: BI.reduce((a, b) => a + b.qty * b.freightUsd, 0),
      shipCost: BI.reduce((a, b) => a + b.qty * (b.goodsUsd + b.freightUsd), 0),
      shipQty: BI.reduce((a, b) => a + b.qty, 0), air: BI.reduce((a, b) => a + (b.isAir ? b.qty : 0), 0), sea: BI.reduce((a, b) => a + (b.isAir ? 0 : b.qty), 0),

    defaultGens, generateRows, parsePaste, excelSampleRows,
  };
});

</script>
<script>
/* 推广计划表 · 网页（第二代）
 * 只负责显示和输入；所有计算都在 PlanModel（model.js）。
 * 状态存在这台电脑的浏览器里（localStorage），可导出/导入方案文件。 */
(function () {
  'use strict';
  const M = window.PlanModel;
  const app = document.getElementById('app');
  const KEY = 'promo-plan-v2';
  const MINUS = '−';

  // ---------- 状态 ----------
  function defaultUi() {
    return { tab: 'plan', planId: 'o1', showFees: false, panel: null, qg: null, addTo: '', pasteText: '', cmpOff: [], confirm: null, renaming: false };
  }
  function defaultState() {
    return {
      v: 2, params: M.defaultParams(), batches: M.defaultBatches(),
      plans: [{ id: 'o1', kind: 'ops', name: '运营方案（Excel 11/7 起 11 天）', rows: M.excelSampleRows() }],
      gens: M.defaultGens(), actuals: {}, ui: defaultUi(),
    };
  }
  // 旧版日期框打字时会写进 1901 年这类错日期，读进来时去掉
  function okRow(r) { const n = r && M.parseDate(r.date); if (n == null) return false; const y = M.parts(n).y; return y >= 2020 && y <= 2100; }
  function normalize(s) {
    const d = defaultState();
    if (!s || s.v !== 2) return d;
    return {
      v: 2,
      params: Object.assign(M.defaultParams(), s.params || {}),
      batches: Array.isArray(s.batches) ? s.batches : d.batches,
      plans: Array.isArray(s.plans) ? s.plans.filter(p => p && Array.isArray(p.rows)).map(p => Object.assign({ kind: 'ops' }, p, { rows: p.rows.filter(okRow) })) : d.plans,
      gens: Array.isArray(s.gens) ? s.gens : d.gens,
      actuals: s.actuals && typeof s.actuals === 'object' ? s.actuals : {},
      ui: Object.assign(defaultUi(), s.ui || {}, { panel: null, confirm: null, renaming: false }),
    };
  }
  let state;
  try { state = normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { state = defaultState(); }
  const TABS = [['plan', '推广计划表'], ['summary', '汇总'], ['cash', '资金盘'], ['annual', '全年表'], ['compare', '方案对比'], ['params', '参数']];
  const h0 = (location.hash || '').replace('#', '');
  if (TABS.some(t => t[0] === h0)) state.ui.tab = h0;

  let ver = 0;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, params: state.params, batches: state.batches, plans: state.plans, gens: state.gens, actuals: state.actuals, ui: { tab: state.ui.tab, planId: state.ui.planId, showFees: state.ui.showFees, cmpOff: state.ui.cmpOff } })); } catch (e) { /* 存不了就算了 */ }
  }
  function commit() { ver++; save(); scheduleRender(); }

  // 撤销（只留最近一步）
  let undoSnap = null;
  function snapshot() { undoSnap = JSON.stringify({ params: state.params, batches: state.batches, plans: state.plans, gens: state.gens, actuals: state.actuals, planId: state.ui.planId }); }
  function undo() {
    if (!undoSnap) return;
    const s = JSON.parse(undoSnap); undoSnap = null;
    Object.assign(state, { params: s.params, batches: s.batches, plans: s.plans, gens: s.gens, actuals: s.actuals });
    state.ui.planId = s.planId; hideToast(); commit();
  }

  // ---------- 方案 ----------
  const genCache = new Map();
  function genRows(g) {
    const k = JSON.stringify(g);
    if (!genCache.has(k)) { if (genCache.size > 50) genCache.clear(); genCache.set(k, M.generateRows(g)); }
    return genCache.get(k);
  }
  function allPlans() {
    return state.plans.map(p => ({ id: p.id, kind: 'ops', name: p.name, rows: p.rows, src: p }))
      .concat(state.gens.map(g => ({ id: 'g:' + g.id, kind: 'tool', name: g.name, rows: genRows(g), gen: g })));
  }
  function curPlan() {
    const ps = allPlans();
    return ps.find(p => p.id === state.ui.planId) || ps[0] || null;
  }
  const calcCache = new Map();
  function calc(plan, horizonEnd) {
    const k = ver + '|' + plan.id + '|' + (horizonEnd || '');
    if (calcCache.has(k)) return calcCache.get(k);
    if (calcCache.size > 40) calcCache.clear();
    const P = horizonEnd ? Object.assign({}, state.params, { horizonEnd }) : state.params;
    const res = M.computePlan(plan.rows, P, state.batches);
    res.cmp = M.compareSummary(res, P, state.batches);
    calcCache.set(k, res);
    return res;
  }

  // ---------- 格式 ----------
  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const ok = x => x != null && typeof x === 'number' && isFinite(x);
  function signed(x, dp, body) { const r = Math.round(Math.abs(x) * Math.pow(10, dp)); return (x < 0 && r > 0 ? MINUS : '') + body; }
  function usd(x, dp) { if (!ok(x)) return ''; dp = dp == null ? 2 : dp; return signed(x, dp, '$' + (dp ? nf2 : nf0).format(Math.abs(x))); }
  function cny(x) { if (!ok(x)) return ''; return signed(x, 0, '¥' + nf0.format(Math.abs(x))); }
  function int(x) { if (!ok(x)) return ''; return signed(x, 0, nf0.format(Math.abs(x))); }
  function n1(x) { if (!ok(x)) return ''; return signed(x, 1, nf1.format(Math.abs(x))); }
  function pct(x, dp) { if (!ok(x)) return ''; dp = dp == null ? 1 : dp; return signed(x, dp + 2, (Math.abs(x) * 100).toFixed(dp) + '%'); }
  function wan(x) { if (!ok(x)) return ''; const a = Math.abs(x) / 10000; return signed(x, 1, '¥' + (a >= 100 ? nf0.format(a) : nf1.format(a)) + '万'); }
  const WD = ['', '一', '二', '三', '四', '五', '六', '日'];
  function fmt(t, v) {
    switch (t) {
      case 'usd': return usd(v); case 'usd0': return usd(v, 0); case 'cny': return cny(v); case 'int': return int(v); case 'num1': return n1(v);
      case 'pct': return pct(v, 1); case 'pct2': return pct(v, 2); case 'date': return ok(v) ? M.fmtDate(v) : (v || '');
      case 'month': return v ? M.monthLabel(v) : ''; case 'wd': return v ? '周' + WD[v] : '';
      case 'cover': return v ? v.status : '';
      default: return v == null ? '' : String(v);
    }
  }
  function iv(x, dp) { if (!ok(x)) return ''; return String(+x.toFixed(dp == null ? 4 : dp)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function parseNum(s) { const t = String(s == null ? '' : s).replace(/[$¥,%\s]/g, ''); if (t === '') return null; const x = parseFloat(t); return isFinite(x) ? x : null; }
  function parseDateLoose(s, yearHint) {
    const str = String(s == null ? '' : s).trim(); if (!str) return null;
    let n = M.parseDate(str);
    if (n == null) {
      const m = str.match(/^(\d{1,2})\s*[-\/.月]\s*(\d{1,2})\s*日?$/);
      if (m) { const mo = +m[1], d = +m[2]; if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) n = M.dn(yearHint || 2026, mo, d); }
    }
    if (n == null) return null;
    const p = M.parts(n);
    return p.y >= 2020 && p.y <= 2100 ? M.fmtDate(n) : null;
  }
  let yearHint = 2026;
  function parseTyped(t, s) {
    if (t === 'text') return String(s);
    if (t === 'date') return parseDateLoose(s, yearHint);
    if (t === 'list') { const a = String(s).split(/[^\d]+/).map(Number).filter(x => x >= 1 && x <= 31); return a.length ? a : null; }
    const x = parseNum(s); if (x == null) return null;
    if (t === 'pct') return x / 100;
    if (t === 'int') return Math.round(x);
    return x;
  }

  // ---------- 下载（导出） ----------
  let DL; // undefined = 还在问；null = 这里不能下载；对象 = 能下载；'blob' = 单独打开的网页
  if (!window.claude || typeof window.claude.use !== 'function') DL = 'blob';
  else {
    try { window.claude.use('downloads').then(ns => { DL = ns || null; scheduleRender(); }, () => { DL = null; scheduleRender(); }); } catch (e) { DL = null; }
  }
  const canSave = () => DL === 'blob' || (DL && typeof DL === 'object');
  async function saveFile(filename, data, mime) {
    if (DL === 'blob') {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return true;
    }
    if (!DL || typeof DL !== 'object') { toast('这里不能下载文件'); return false; }
    try { await DL.save({ filename, data }); toast('已保存 ' + filename); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return false;
      if (c === 'rate_limited') toast('上一个保存窗口还没关，稍后再点');
      else { toast('这里不能下载文件'); if (c !== 'too_large') { DL = null; scheduleRender(); } }
      return false;
    }
  }

  // ---------- 渲染调度（按住鼠标时不重画，免得点不中按钮） ----------
  let timer = null, pending = false, pointerDown = false;
  function scheduleRender() {
    pending = true;
    if (pointerDown || timer) return;
    timer = setTimeout(render, 0);
  }
  // 只在按住按钮时暂缓（下拉框、日期框、选文件会吃掉松开的事件，不能等）；最多等 600ms
  let holdT = null;
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('button, a[data-act], .chip');
    if (!t) return;
    pointerDown = true; clearTimeout(holdT); holdT = setTimeout(release, 600);
  }, true);
  const release = () => { clearTimeout(holdT); pointerDown = false; if (pending && !timer) timer = setTimeout(render, 0); };
  document.addEventListener('pointerup', release, true);
  document.addEventListener('pointercancel', release, true);

  let pendingFocus = null;
  function captureFocus() {
    const a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.fk) return null;
    let s = null; try { s = a.selectionStart; } catch (e) { /* 日期框没有 */ }
    return { fk: a.dataset.fk, s };
  }
  function restoreFocus(f) {
    if (pendingFocus) { f = { fk: pendingFocus, s: null, all: true }; pendingFocus = null; }
    if (!f) return;
    const el = app.querySelector('[data-fk="' + CSS.escape(f.fk) + '"]');
    if (!el) return;
    el.focus({ preventScroll: true });
    try { if (f.all && el.select) el.select(); else if (f.s != null && el.setSelectionRange) el.setSelectionRange(f.s, f.s); } catch (e) { /* 忽略 */ }
  }
  function captureScroll() { const o = {}; app.querySelectorAll('[data-sk]').forEach(el => { o[el.dataset.sk] = [el.scrollLeft, el.scrollTop]; }); return o; }
  function restoreScroll(o) { app.querySelectorAll('[data-sk]').forEach(el => { const v = o[el.dataset.sk]; if (v) { el.scrollLeft = v[0]; el.scrollTop = v[1]; } }); }

  function render() {
    timer = null; pending = false;
    const f = captureFocus(); const sc = captureScroll();
    const tab = state.ui.tab;
    let body = '';
    try {
      body = tab === 'plan' ? viewPlan() : tab === 'summary' ? viewSummary() : tab === 'cash' ? viewCash() : tab === 'annual' ? viewAnnual() : tab === 'compare' ? viewCompare() : viewParams();
    } catch (e) {
      console.error(e);
      body = '<div class="card"><div class="bd">这一页算的时候出错了：' + esc(e.message) + '。可以到「参数」→「恢复默认」。</div></div>';
    }
    app.innerHTML = viewHeader() + '<main class="wrap">' + body + '</main>';
    restoreScroll(sc); restoreFocus(f);
    wireChart();
  }

  // ---------- 头部 ----------
  function viewHeader() {
    const P = state.params;
    const qty = state.batches.reduce((a, b) => a + (+b.qty || 0), 0);
    const seg = ['finance', 'sheet'].map(k => '<button data-act="preset" data-k="' + k + '" class="' + (P.preset === k ? 'on' : '') + '" title="' + (k === 'finance' ? 'FBA $6.50、退货 10% + $3、仓储 $0.11，货值按发货批次' : 'FBA $6.04、退货 8%、仓储 $0.09，货值 $8.51 + 头程 $1.12（对数用）') + '">' + M.PRESET_LABEL[k] + '</button>').join('');
    return '<header class="top"><div class="wrap"><div class="bar">'
      + '<div class="brand"><h1>推广计划表</h1><small>Y背三件套 · 发货批次 ' + int(qty) + ' 套 · 汇率 ' + esc(P.fx) + ' · 现金 ' + cny(P.cashStart) + '</small></div>'
      + '<div class="seg" role="group" aria-label="费率口径">' + seg + '</div>'
      + (P.preset !== 'finance' && P.preset !== 'sheet' ? '<span class="tag">费率已手改</span>' : '')
      + (canSave() ? '<button class="btn" data-act="exportXlsx">导出 Excel</button>' : '')
      + '</div><nav class="tabs">' + TABS.map(t => '<button data-act="tab" data-k="' + t[0] + '" class="' + (state.ui.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</nav></div></header>';
  }

  // ---------- 方案选择条 ----------
  function planSelect() {
    const ps = allPlans(); const cur = curPlan();
    const opt = p => '<option value="' + esc(p.id) + '"' + (cur && p.id === cur.id ? ' selected' : '') + '>' + esc(p.name || '（没起名）') + '</option>';
    const ops = ps.filter(p => p.kind === 'ops'), tools = ps.filter(p => p.kind === 'tool');
    return '<select class="sel" data-f="planSel" data-fk="planSel" aria-label="选方案">'
      + (ops.length ? '<optgroup label="运营的方案">' + ops.map(opt).join('') + '</optgroup>' : '')
      + (tools.length ? '<optgroup label="工具出的方案">' + tools.map(opt).join('') + '</optgroup>' : '') + '</select>';
  }
  function planBar(withTools) {
    const p = curPlan();
    if (!p) return '<div class="card"><div class="bd">还没有方案。<button class="btn pri" data-act="newPlan">新建运营方案</button></div></div>';
    let h = '<div class="planbar"><label>方案</label>' + planSelect()
      + (p.kind === 'ops' ? '<span class="tag">运营的</span>' : '<span class="tag tool">工具出的</span>');
    if (withTools) {
      if (p.kind === 'ops') {
        if (state.ui.renaming) h += '<input class="sel" style="min-width:0;flex:1 1 160px;max-width:320px" data-f="planName" data-fk="planName" value="' + esc(p.name) + '" aria-label="方案名"><button class="btn" data-act="renameDone">好</button>';
        else h += '<button class="btn ghost" data-act="rename">改名</button>';
        h += '<span class="sp"></span><button class="btn" data-act="dupPlan">复制成新方案</button><button class="btn" data-act="newPlan">新建空白方案</button><button class="btn danger" data-act="delPlan">删除这套</button>';
      } else {
        h += '<span class="sp"></span><button class="btn" data-act="copyTool">复制成运营方案</button><button class="btn" data-act="tab" data-k="compare">去改这套的参数</button>';
      }
    }
    return h + '</div>';
  }

  function kpis(res) {
    const T = res.totals, c = res.cmp, fx = state.params.fx;
    const stock = res.soldOut != null ? ('卖完 / 断货 ' + M.shortDate(res.soldOut)) : ('剩 ' + int(res.stockEnd) + ' 套');
    const k = (l, v, s) => '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
    return '<div class="kpis">'
      + k('天数 · 单量', int(res.rows.length) + ' 天', '实卖 ' + int(T.units) + ' 单' + (T.short > 0.5 ? '（计划 ' + int(T.unitsPlan) + '）' : ''))
      + k('销售额', usd(T.sales, 0), cny(T.sales * fx))
      + k('广告花费', usd(T.adSpend, 0), 'TACOS ' + pct(T.tacos))
      + k('净回款（已扣广告）', usd(T.net, 0), cny(T.net * fx))
      + k('订单毛利', usd(T.profit, 0), cny(T.profit * fx))
      + k('库存', res.soldOut != null ? M.shortDate(res.soldOut) : int(res.stockEnd), stock)
      + k('账上最低现金', cny(c.minBal), M.fmtDate(c.minDate) + ' · 资金盘')
      + '</div>';
  }

  // ---------- 表一：推广计划表 ----------
  const COLS = [
    { k: 'date', l: '日期', inp: 'date', t: 'date' },
    { k: 'weekday', l: '星期', t: 'wd' },
    { k: 'price', l: '前台售价 $', inp: 'num', t: 'usd' },
    { k: 'prime', l: 'prime %', inp: 'pct', t: 'pct', fee: 1 },
    { k: 'coupon', l: 'coupon %', inp: 'pct', t: 'pct' },
    { k: 'couponUse', l: 'coupon 使用率 %', inp: 'pct', t: 'pct', fee: 1 },
    { k: 'primeUse', l: 'prime 使用率 %', inp: 'pct', t: 'pct', fee: 1 },
    { k: 'minPrice', l: '最低成交价', t: 'usd', fee: 1 },
    { k: 'avgPrice', l: '成交均价', t: 'usd' },
    { k: 'unitPayback', l: '单价回款', t: 'usd' },
    { k: 'adSpend', l: '广告花费 $', inp: 'num', t: 'usd' },
    { k: 'cpc', l: 'CPC $', inp: 'num', t: 'usd' },
    { k: 'ctr', l: 'CTR %', inp: 'pct', t: 'pct2' },
    { k: 'cvr', l: 'CVR %', inp: 'pct', t: 'pct' },
    { k: 'cpa', l: 'CPA', t: 'usd' },
    { k: 'acos', l: 'ACOS', t: 'pct' },
    { k: 'tacos', l: 'TACOS', t: 'pct' },
    { k: 'units', l: '总单量', inp: 'num', t: 'int' },
    { k: 'adUnits', l: '广告单', t: 'num1' },
    { k: 'adShare', l: '广告单占比 %', inp: 'pct', t: 'pct' },
    { k: 'natural', l: '自然单', t: 'num1' },
    { k: 'naturalShare', l: '自然单占比', t: 'pct', fee: 1 },
    { k: 'couponUnits', l: '用券单量', t: 'num1', fee: 1 },
    { k: 'commission', l: '佣金', t: 'usd', fee: 1 },
    { k: 'fba', l: 'FBA', t: 'usd', fee: 1 },
    { k: 'returns', l: '退货损失', t: 'usd', fee: 1 },
    { k: 'storage', l: '仓储', t: 'usd', fee: 1 },
    { k: 'couponFee', l: 'coupon 费', t: 'usd', fee: 1 },
    { k: 'activity', l: '活动费用 $', inp: 'num', t: 'usd', fee: 1 },
    { k: 'goodsU', l: '货值 / 件', t: 'usd', fee: 1 },
    { k: 'freightU', l: '头程 / 件', t: 'usd', fee: 1 },
    { k: 'breakEvenCpa', l: '不垫钱 CPA', t: 'usd', fee: 1 },
    { k: 'payback', l: '回款（未扣广告）', t: 'usd', fee: 1 },
    { k: 'net', l: '净回款（已扣广告）', t: 'usd' },
    { k: 'payDate', l: '回款日期', t: 'date' },
    { k: 'payMonth', l: '回款月份', t: 'month', fee: 1 },
    { k: 'profit', l: '订单毛利', t: 'usd' },
    { k: 'sales', l: '总销售额', t: 'usd' },
    { k: 'stockLeft', l: '库存剩余', t: 'stock' },
  ];
  const SUM_KEYS = new Set(['adSpend', 'units', 'adUnits', 'natural', 'couponUnits', 'couponFee', 'activity', 'payback', 'net', 'profit', 'sales']);
  function footVal(k, T, rows) {
    if (SUM_KEYS.has(k)) return k === 'units' ? T.units : T[k] != null ? T[k] : rows.reduce((a, r) => a + (r[k] || 0), 0);
    const units = T.units;
    if (k === 'avgPrice') return units ? T.sales / units : null;
    if (k === 'unitPayback') return units ? T.payback / units : null;
    if (k === 'cpa') return T.adUnits ? T.adSpend / T.adUnits : null;
    if (k === 'acos') return T.acos; if (k === 'tacos') return T.tacos;
    if (k === 'adShare') return units ? T.adUnits / units : null;
    if (k === 'naturalShare') return units ? T.natural / units : null;
    return null;
  }

  function viewPlan() {
    const p = curPlan();
    if (!p) return planBar(true);
    const res = calc(p);
    const editable = p.kind === 'ops';
    const showFees = state.ui.showFees;
    const cols = COLS.filter(c => showFees || !c.fee);
    const byIdx = new Map(res.rows.map(r => [r.idx, r]));
    let h = '<div class="card"><div class="bd">' + planBar(true) + '</div></div>';
    if (!editable) h += '<div class="banner">这是工具按「方案对比 → 出方案」的参数自动生成的（' + esc(p.name) + '），这里只能看。想在它基础上改，点「复制成运营方案」；改它的参数去「方案对比」。改工具出的方案不影响运营的表。</div>';
    h += kpis(res);
    // 工具条
    let bar = '';
    if (editable) {
      bar += '<button class="btn" data-act="addDay" title="复制最后一行，日期加一天">加一天（复制上一行）</button>'

    h += '<div class="tw tall" data-sk="plan"><table class="t"><thead>' + th + '</thead><tbody>' + tb + '</tbody><tfoot>' + tf + '</tfoot></table></div>';
    h += '<div class="bd"><p class="note">单价回款 = 成交均价 − 佣金 − FBA − 退货损失 − coupon 费 − 仓储（费用明细里能看每一项）。广告花费 = CPA × 广告单（CPA = CPC ÷ CVR），和你的 Excel 一样；直接改广告花费会倒推广告单占比。回款日期 = 下单 + ' + esc(state.params.payDays) + ' 天。订单毛利 = 净回款 − 单量 × 这批货的货值 + 头程。库存按「参数」里的发货批次表扣，卖完以后的单不算回款。CTR 只作参考，不参与计算。</p></div>';

  }

  // 快速生成（递增率）
  const GEN_FIELDS = [

  }
  function viewQuickGen(p) {

  function viewPaste() {

  function pasteInfo() {

  // ---------- 汇总 ----------
  const WEEK_COLS = [{ l: '周', k: 'key', t: 'text' }, { l: '单量', k: 'units', t: 'int' }, { l: '广告花费 $', k: 'adSpend', t: 'usd' }, { l: '回款（已扣广告）$', k: 'net', t: 'usd' }, { l: '利润 $', k: 'profit', t: 'usd' }, { l: '销售额 $', k: 'sales', t: 'usd' }];

  const CASH_COLS = [

    { l: '当月发货数量', k: 'shipQty', t: 'int' }, { l: '空运', k: 'air', t: 'int' }, { l: '海运', k: 'sea', t: 'int' }, { l: '当月发货货值 + 头程 $', k: 'shipCost', t: 'usd' },

    { l: '回款流覆盖未来三个月货值头程', k: 'coverCash', t: 'cover' }, { l: '现金流利润覆盖未来三个月货值头程', k: 'coverProfit', t: 'cover' },

  function simpleTable(cols, rows, foot, sk, extra) {
    const th = '<tr>' + cols.map((c, j) => '<th class="' + (j === 0 ? 'stk l' : '') + '">' + c.l + '</th>').join('') + '</tr>';

  }
  function weekRows(res) { return res.weeks.map(w => ({ key: w.key, units: w.units, adSpend: w.adSpend, net: w.net, profit: w.profit, sales: w.sales })); }
  function weekFoot(res) { const T = res.totals; return [{ key: '合计', units: T.units, adSpend: T.adSpend, net: T.net, profit: T.profit, sales: T.sales }]; }
  function monthFoot(res) {
    const t = res.monthTotal, fx = state.params.fx;
    return [Object.assign({ month: '' }, t, { growth: null, _label: '合计' }), { _label: '折人民币（×' + fx + '）', netByOrder: t.netByOrder * fx, netByPay: t.netByPay * fx, profit: t.profit * fx, profitByPay: t.profitByPay * fx, sales: t.sales * fx, _cny: true }];

  // ---------- 资金盘 ----------
  const KIND = { sales: '回款到账', ad: '广告', fixed: '固定开支', goods: '货款到期', freight: '头程到期' };
  let chartData = null;
  function chartWidth() { const m = app.querySelector('main'); const w = m ? m.clientWidth : window.innerWidth; return Math.max(300, Math.min(1200, w - 60)); }
  function niceStep(span) { const raw = span / 4 || 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function cashChart(L) {
    const daily = L.daily; if (!daily.length) { chartData = null; return ''; }
    const W = chartWidth(), H = 250, ml = 62, mr = 14, mt = 18, mb = 26;
    const d0 = daily[0].d, d1 = daily[daily.length - 1].d;
    let lo = Math.min(0, ...daily.map(p => p.bal)), hi = Math.max(0, ...daily.map(p => p.bal));
    const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
    const x = d => ml + (d - d0) / Math.max(1, d1 - d0) * (W - ml - mr);
    const y = v => mt + (hi - v) / (hi - lo) * (H - mt - mb);
    let g = '';
    for (let v = lo; v <= hi + 1e-6; v += step) g += '<line class="gl" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="ax" x="' + (ml - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(wan(v)) + '</text>';
    let mk = M.monthKey(d0); const lastMk = M.monthKey(d1); let guard = 0;
    while (mk <= lastMk && guard++ < 60) {
      const [yy, mm] = mk.split('-').map(Number); const d = M.dn(yy, mm, 1);
      if (d >= d0) g += '<line class="tk" x1="' + x(d).toFixed(1) + '" x2="' + x(d).toFixed(1) + '" y1="' + (H - mb) + '" y2="' + (H - mb + 4) + '"/><text class="ax" x="' + (x(d) + 3).toFixed(1) + '" y="' + (H - 8) + '">' + (mm === 1 && W >= 640 ? yy + '年' : '') + mm + '月</text>';

  function wireChart() {
    const box = document.getElementById('cashChart'); if (!box || !chartData) return;
    const svg = box.querySelector('svg'), tip = box.querySelector('#tip'), cx = box.querySelector('#cx'), cd = box.querySelector('#cd');
    const C = chartData;
    const move = ev => {
      const rc = svg.getBoundingClientRect(); const sx = (ev.clientX - rc.left) / rc.width * C.W;
      const d = Math.round(C.d0 + (sx - C.ml) / (C.W - C.ml - C.mr) * Math.max(1, C.d1 - C.d0));
      const i = Math.max(0, Math.min(C.daily.length - 1, d - C.d0)); const p = C.daily[i];
      const px = C.x(p.d), py = C.y(p.bal);
      cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.style.display = '';
      cd.setAttribute('cx', px); cd.setAttribute('cy', py); cd.style.display = '';
      tip.hidden = false; tip.textContent = M.fmtDate(p.d) + ' · ' + cny(p.bal);
      tip.style.left = (px / C.W * rc.width) + 'px'; tip.style.top = (py / C.H * rc.height) + 'px';
    };
    const leave = () => { tip.hidden = true; cx.style.display = 'none'; cd.style.display = 'none'; };

  }
